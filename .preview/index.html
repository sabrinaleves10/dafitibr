    '<div class="skeleton">' +
      '<div class="skel-line" style="width:40%;height:26px;margin-bottom:20px"></div>' +
      '<div class="skel-line" style="width:92%"></div>' +
      '<div class="skel-line" style="width:85%"></div>' +
      '<div class="skel-line" style="width:70%"></div>' +
    '</div>';
  markActive('__dashboard__');

  try {
    const [projectText, checklistText] = await Promise.all([
      fetch('../PROJECT.md', { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject(new Error('PROJECT.md HTTP ' + r.status))),
      fetch('../CHECKLIST.md', { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject(new Error('CHECKLIST.md HTTP ' + r.status))),
    ]);

    const wrap = document.createElement('div');
    wrap.className = 'doc';

    if (hasUnfilledPlaceholders(projectText)) {
      wrap.innerHTML = '<h1>Dashboard</h1><p>This repo hasn\'t been initialized yet — ' +
        '<code>PROJECT.md</code> still has unfilled <code>{{PLACEHOLDER}}</code> values. The ' +
        'dashboard aggregates health, open risks, and upcoming milestones once initialize mode ' +
        'has run.</p>';
      docContainer.innerHTML = '';
      docContainer.appendChild(wrap);
      return;
    }

    const header = parseHeaderBlock(projectText);
    const quickFacts = parseMarkdownTable(extractSection(projectText, /^###\s+Quick Facts/, /^###\s|^##\s/));
    const allRiskRows = parseMarkdownTable(extractSection(checklistText, /^##\s+D\./, /^##\s+[A-Z]\./));
    const riskRows = allRiskRows
      .filter(r => !/✅/.test(r['Status'] || ''))
      .sort((a, b) => severityRank(a['Severity']) - severityRank(b['Severity']));
    const closedRiskRows = allRiskRows.filter(r => /✅\s*Closed/.test(r['Status'] || ''));
    const acceptedRiskRows = allRiskRows.filter(r => /✅\s*Accepted/.test(r['Status'] || ''));
    const registry = parseAdrBnRegister(checklistText);
    const milestoneRows = parseMarkdownTable(extractSection(checklistText, /^##\s+E\./, /^##\s+[A-Z]\./))
      .filter(r => !/✅/.test(r['Status'] || ''));

    const statusText = findHeaderField(header, /^Status$/i);
    const healthKey = Object.keys(header).find(k => /^Health/i.test(k));
    const healthText = healthKey ? header[healthKey] : '';
    const badgeSource = healthText || statusText;
    const emoji = emojiIn(badgeSource);
    const badgeClass = badgeClassFor(emoji);
    const owner = findHeaderField(header, /^Owner$/i);
    const version = findHeaderField(header, /^Version$/i);
    const lastUpdated = findHeaderField(header, /^Last updated$/i);
    const rocketlaneKey = Object.keys(header).find(k => /Rocketlane/i.test(k));
    const rocketlaneVal = rocketlaneKey ? header[rocketlaneKey] : '';
    const [docStages, upcomingTasks, atlasDocs, newTaskCandidates] = await Promise.all([
      scanDocStages().catch(() => []),
      scanUpcomingTasks().catch(() => []),
      scanAtlasDocs().catch(() => []),
      scanNewTaskCandidates().catch(() => []),
    ]);
    const cnSummary = customerNeedsByStatus(checklistText);
    const docsNeedingReviewCount = docStages.reduce((sum, t) =>
      sum + (t.stages['Drafts'] || []).length + (t.stages['Reviewed'] || []).length, 0) +
      atlasDocs.filter(d => d.reviewed && !d.reviewed.reviewed).length;
    const pendingAtlasCount = atlasDocs.filter(d => d.candidate.suggested && !d.approved.approved).length;
    const todayMidnight = new Date(); todayMidnight.setHours(0, 0, 0, 0);
    const highPriorityTasks = upcomingTasks.filter(t => isHighPriorityTask(t, todayMidnight)).sort(sortByDaysUntil);
    const lessPriorityTasks = upcomingTasks.filter(t => !isHighPriorityTask(t, todayMidnight)).sort(sortByDaysUntil);
    const pendingCandidatesCount = newTaskCandidates.filter(r => !isCandidateClosed(r.status)).length;

    let html = '<h1>Dashboard</h1>';
    html += renderDashboardTabs(activeTab);

    if (activeTab === 'overview') {
      html += '<div class="dash-health-card">' +
        '<span class="badge ' + badgeClass + '">' + (emoji || '•') + ' ' +
          (badgeSource.split(' — ')[0].replace(/^(?:🟢|🟡|🟠|🔴)\s*/u, '').trim() || 'Status') + '</span>' +
        '<span class="dash-health-text">' + marked.parseInline(healthText || statusText || 'No status recorded yet.') + '</span>' +
        '</div>';

      html += '<div class="dash-fact-grid">';
      html += dashFactRow('Owner', owner);
      html += dashFactRow('Version', version);
      html += dashFactRow('Last updated', lastUpdated);
      html += dashFactRow(rocketlaneKey || 'Rocketlane', rocketlaneVal);
      quickFacts.forEach(row => {
        if (row['Field'] && row['Value']) html += dashFactRow(row['Field'], row['Value']);
      });
      html += '</div>';

      html += '<div class="dash-stat-grid">' +
        dashStatTile(riskRows.length, 'Open risks', '#dashboard:risks', riskRows.length > 0) +
        dashStatTile(milestoneRows.length, 'Upcoming milestones', '#dashboard:risks', false) +
        dashStatTile(docsNeedingReviewCount + pendingAtlasCount, 'Docs needing attention', '#dashboard:documents', (docsNeedingReviewCount + pendingAtlasCount) > 0) +
        dashStatTile(highPriorityTasks.length, 'High priority tasks', '#dashboard:tasks', highPriorityTasks.length > 0) +
        dashStatTile(pendingCandidatesCount, 'New task candidates', '#dashboard:tasks', pendingCandidatesCount > 0) +
        '</div>';

      html += '<p class="dash-footnote">Pulled live from <a href="#PROJECT.md">PROJECT.md</a>\'s header and Quick Facts — ' +
        'edit that file to change what shows here.</p>';

    } else if (activeTab === 'risks') {
      html += '<h2 id="dash-open-risks">Open Risks &amp; Issues (' + riskRows.length + ')</h2>';
      if (riskRows.length) {
        html += '<div class="dash-list">' +
          riskRows.map(r => dashItem('risk', '#', 'Risk / Issue', 'Status', r, 'Severity')).join('') +
          '</div>';
      } else {
        html += '<div class="dash-empty">No open risks right now 🎉</div>';
      }
      const resolvedRiskCount = closedRiskRows.length + acceptedRiskRows.length;
      if (resolvedRiskCount) {
        html += '<p class="dash-footnote" style="margin-top:-14px">' + resolvedRiskCount +
          ' more risk' + (resolvedRiskCount === 1 ? ' is' : 's are') + ' closed or accepted — see ' +
          '<a href="#dashboard:closed-risks">Closed Risks</a> for how each one is handled.</p>';
      }

      html += '<h2 id="dash-upcoming-milestones">Upcoming Milestones (' + milestoneRows.length + ')</h2>';
      if (milestoneRows.length) {
        html += '<div class="dash-list">' +
          milestoneRows.map(r => dashItem('milestone', '#', 'Milestone', 'Status', r)).join('') +
          '</div>';
      } else {
        html += '<div class="dash-empty">Nothing pending — every tracked milestone is done.</div>';
      }

      html += '<p class="dash-footnote">Pulled live from <a href="#CHECKLIST.md">CHECKLIST.md</a> Sections D/E — ' +
        'edit that file to change what shows here.</p>';

    } else if (activeTab === 'closed-risks') {
      html += '<p>Risks that are no longer open, and how each one was resolved or will be handled so it ' +
        'doesn\'t materialize. <strong>Closed</strong> risks were resolved by a decision, a fix, or a scope ' +
        'change; <strong>Accepted</strong> risks are inherent constraints of the chosen model, handled by ' +
        'the process described instead of a pending decision.</p>';
      html += '<h2 id="dash-closed-risks">Closed (' + closedRiskRows.length + ')</h2>' + renderClosedRiskList(closedRiskRows, registry);
      html += '<h2 id="dash-accepted-risks">Accepted (' + acceptedRiskRows.length + ')</h2>' + renderClosedRiskList(acceptedRiskRows, registry);
      html += '<p class="dash-footnote">Pulled live from <a href="#CHECKLIST.md">CHECKLIST.md</a> Section D\'s ' +
        '"Resolution / How it\'s handled" column — edit that file to change what shows here. Risks dismissed as ' +
        'never having been real risks are removed from the register instead; see <a href="#JOURNAL.md">JOURNAL.md</a>.</p>';

    } else if (activeTab === 'documents') {
      if (pendingAtlasCount) {
        html += '<a class="dash-attention" href="#approvals" style="display:block; text-decoration:none;">' +
          '<div class="dash-attention-head">📋 Needs your attention</div>' +
          '<div class="dash-attention-sub">' + pendingAtlasCount + ' document' +
            (pendingAtlasCount === 1 ? '' : 's') + ' suggested for Atlas, awaiting your confirmation — open Approvals &rarr;</div>' +
          '</a>';
      }

      html += '<h2 id="dash-documents-by-stage">Documents by Stage</h2>';
      html += renderDocStageTable(docStages);
      html += '<h3 id="dash-docs-needing-review">Needs SA review (Needs review / Waiting for approval)</h3>';
      html += renderDocsNeedingReview(docStages);
      html += '<h3 id="dash-customer-needs">Customer Needs / Feature Requests</h3>';
      html += renderCustomerNeedsSummary(cnSummary);

      html += '<p class="dash-footnote">Pulled live from the <code>ADRs/</code> and ' +
        '<code>Behavior Notes/</code> stage folders under <code>Internal Documents/Architecture/</code>, ' +
        'and <a href="#CHECKLIST.md">CHECKLIST.md</a> Section H — edit those to change what shows here. ' +
        '"Needs your attention" above is a separate signal (Atlas candidacy, ' +
        '<code>CLAUDE.md</code> Hard Rule 12), not document stage — see the full breakdown on ' +
        '<a href="#approvals">Approvals</a>.</p>';

    } else if (activeTab === 'tasks') {
      html += '<h2 id="dash-new-task-candidates">New Task Candidates (' + pendingCandidatesCount + ')</h2>';
      html += renderNewTaskCandidates(newTaskCandidates);
      html += '<p class="dash-footnote">Pulled live from ' +
        '<a href="#path=' + encodeURIComponent(ACTION_TRACKER_PATH) + '">ACTION-TRACKER.md</a> ' +
        'Section C — newly-identified Rocketlane task candidates land here automatically, with no ' +
        'chat approval needed for this write; review and approve/discard each row here.</p>';

      html += '<h2 id="dash-high-priority-tasks">High Priority (' + highPriorityTasks.length + ')</h2>';
      html += renderTaskList(highPriorityTasks, 'Nothing high priority right now 🎉');

      html += '<h2 id="dash-less-priority-tasks">Less Priority (' + lessPriorityTasks.length + ')</h2>';
      html += renderTaskList(lessPriorityTasks, 'Nothing else tracked right now.');

      html += '<p class="dash-footnote">Pulled live from ' +
        '<a href="#path=' + encodeURIComponent(ACTION_TRACKER_PATH) + '">ACTION-TRACKER.md</a> — ' +
        'due dates come from its daily Rocketlane mirror, not a live Rocketlane call. Only rows with ' +
        'a live, linked Rocketlane task are shown here; ledger-only rows with no Rocketlane ' +
        'counterpart (see ROCKETLANE-RECONCILIATION-RULES.md §18) are tracked in the file but not ' +
        'surfaced as tasks. <strong>High Priority</strong> = Rocketlane Priority is explicitly High, ' +
        'or overdue, or due within ' + HIGH_PRIORITY_DUE_BUSINESS_DAYS + ' business days; ' +
        '<strong>Less Priority</strong> = everything else.</p>';
    }

    wrap.innerHTML = html;
    docContainer.innerHTML = '';
    docContainer.appendChild(wrap);
    buildToc(wrap);
  } catch (e) {
    docContainer.innerHTML = '<div class="error-box">Could not build the dashboard — ' + e.message + '</div>';
  }
}

  topbarBadge.style.display = 'none';

      '<div class="skel-line" style="width:85%"></div>' +
    '</div>';
  markActive('__dashboard__');

  try {
    const checklistText = await fetch('../CHECKLIST.md', { cache: 'no-store' })
      .then(r => r.ok ? r.text() : Promise.reject(new Error('CHECKLIST.md HTTP ' + r.status)));

    const sectionRe = kind === 'risk' ? /^##\s+D\./ : /^##\s+E\./;
    const rows = parseMarkdownTable(extractSection(checklistText, sectionRe, /^##\s+[A-Z]\./));
    const row = rows.find(r => r['#'] === id);

    const wrap = document.createElement('div');
    wrap.className = 'doc';

    if (!row) {
      wrap.innerHTML = '<h1>' + (kind === 'risk' ? 'Risk' : 'Milestone') + ' ' + id + '</h1>' +
        '<p>Not found in <code>CHECKLIST.md</code> anymore — it may have been renumbered or ' +
        'removed. <a href="#dashboard:risks">Back to Dashboard</a>.</p>';
      docContainer.innerHTML = '';
      docContainer.appendChild(wrap);
      return;
    }

    let html = '<p><a href="#dashboard:risks">&larr; Dashboard</a></p>';
    html += '<h1>' + (kind === 'risk' ? 'Risk' : 'Milestone') + ' ' + id + '</h1>';
    html += '<div class="dash-fact-grid" style="margin-top:20px">';
    Object.keys(row).forEach(key => {
      if (key === '#') return;
      html += dashFactRow(key, row[key]);
    });
    // Risks routinely name the ADR/BN that explains how they're being mitigated -- surface those
    // as clickable links rather than leaving them as inert text buried in the Notes column.
    if (kind === 'risk') {
      try {
        html += renderRelatedDocs(row, parseAdrBnRegister(checklistText));
      } catch (e) {
        // The ADR/BN register may not exist yet on a fresh/template repo -- related-docs is a
        // bonus, not core to showing the risk itself, so fail quietly here.
      }
    }
    html += '</div>';
    html += '<p class="dash-footnote">From <a href="#CHECKLIST.md">CHECKLIST.md</a>\'s ' +
      (kind === 'risk' ? 'Open Risks &amp; Issues' : 'Milestones') + ' section — edit that file ' +
      'to change what shows here.</p>';

    wrap.innerHTML = html;
    docContainer.innerHTML = '';
    docContainer.appendChild(wrap);
  } catch (e) {
    docContainer.innerHTML = '<div class="error-box">Could not load this item — ' + e.message + '</div>';
  }
}

let diagramScale = 1, diagramX = 0, diagramY = 0;
let isDraggingDiagram = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

function applyDiagramTransform() {
  if (!diagramSvg) return;
  diagramSvg.style.transform =
    'translate(calc(-50% + ' + diagramX + 'px), calc(-50% + ' + diagramY + 'px)) scale(' + diagramScale + ')';
}

function openDiagramModal(svgEl) {
  const clone = svgEl.cloneNode(true);
  clone.removeAttribute('width');
  clone.removeAttribute('height');
  clone.style.maxWidth = 'none';
  clone.style.maxHeight = 'none';
  const old = diagramCanvas.querySelector('svg');
  if (old) old.remove();
  diagramCanvas.appendChild(clone);
  diagramSvg = clone;
  diagramScale = 1; diagramX = 0; diagramY = 0;
  applyDiagramTransform();
  diagramModal.classList.add('open');
}

function closeDiagramModal() {
  diagramModal.classList.remove('open');
}

document.getElementById('diagram-close').addEventListener('click', closeDiagramModal);
document.getElementById('diagram-zoom-in').addEventListener('click', () => {
  diagramScale = Math.min(diagramScale * 1.25, 8);
  applyDiagramTransform();
});
document.getElementById('diagram-zoom-out').addEventListener('click', () => {
  diagramScale = Math.max(diagramScale / 1.25, 0.2);
  applyDiagramTransform();
});
document.getElementById('diagram-zoom-reset').addEventListener('click', () => {
  diagramScale = 1; diagramX = 0; diagramY = 0;
  applyDiagramTransform();
});

diagramModal.addEventListener('click', (e) => { if (e.target === diagramModal) closeDiagramModal(); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && diagramModal.classList.contains('open')) closeDiagramModal();
});

diagramCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  diagramScale = Math.min(Math.max(diagramScale * delta, 0.2), 8);
  applyDiagramTransform();
}, { passive: false });

diagramCanvas.addEventListener('mousedown', (e) => {
  if (e.target.closest('.diagram-modal-toolbar')) return;
  isDraggingDiagram = true;
  diagramCanvas.classList.add('grabbing');
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = diagramX; panStartY = diagramY;
});
window.addEventListener('mousemove', (e) => {
  if (!isDraggingDiagram) return;
  diagramX = panStartX + (e.clientX - dragStartX);
  diagramY = panStartY + (e.clientY - dragStartY);
  applyDiagramTransform();
});
window.addEventListener('mouseup', () => {
  isDraggingDiagram = false;
  diagramCanvas.classList.remove('grabbing');
});

// Any rendered Mermaid diagram (in any loaded doc) is clickable to expand.
docContainer.addEventListener('click', (e) => {
  const pre = e.target.closest('pre.mermaid');
  if (!pre) return;
  const svg = pre.querySelector('svg');
  if (svg) openDiagramModal(svg);
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
